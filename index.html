<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="BaliPlex — browse and watch IPTV channels in a cinema-style player." />
  <title>BaliPlex</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    href="https://cdn.jsdelivr.net/npm/video.js@8.21.0/dist/video-js.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/tom-select@2.4.1/dist/css/tom-select.default.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <h1 class="brand-mark">BaliPlex</h1>
      <span class="brand-tag">Live TV</span>
    </div>
    <div class="header-meta">
      <span id="totalChannels">0 Channels</span>
      <button
        type="button"
        id="refreshBtn"
        class="icon-btn"
        title="Refresh playlist"
        aria-label="Refresh playlist"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.6-6.3" stroke-linecap="round" />
          <path d="M21 3v6h-6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </header>

  <div class="app">
    <aside class="sidebar">
      <div class="list-mode" role="tablist" aria-label="Channel lists">
        <button
          type="button"
          id="listFavouritesBtn"
          class="mode-btn is-active"
          role="tab"
          aria-pressed="true"
        >
          Favourites
        </button>
        <button
          type="button"
          id="listAllBtn"
          class="mode-btn"
          role="tab"
          aria-pressed="false"
        >
          All channels
        </button>
      </div>

      <div class="filters" id="filtersPanel">
        <div class="field">
          <label for="search">Search</label>
          <input
            id="search"
            type="search"
            placeholder="Search channels..."
            autocomplete="off"
          />
        </div>

        <div class="field">
          <label for="countryFilter">Country</label>
          <select id="countryFilter">
            <option value="">All Countries</option>
          </select>
        </div>

        <div class="field">
          <label for="categoryFilter">Category</label>
          <select id="categoryFilter">
            <option value="">All Categories</option>
          </select>
        </div>

        <span id="status">Ready</span>
      </div>

      <div id="channelList">
        <div class="empty">Loading favourites…</div>
      </div>
    </aside>

    <main class="stage">
      <div class="player-shell">
        <div class="player-nav">
          <button
            type="button"
            id="prevChannel"
            class="nav-channel"
            title="Previous channel (←)"
            aria-label="Previous channel"
            disabled
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
              <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button
            type="button"
            id="nextChannel"
            class="nav-channel"
            title="Next channel (→)"
            aria-label="Next channel"
            disabled
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
              <path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>

        <div id="playerStage">
          <video
            id="videoPlayer"
            class="video-js vjs-big-play-centered vjs-baliplex"
            playsinline
            preload="auto"
          ></video>
        </div>
      </div>

      <div class="now-playing">
        <h2 id="channelTitle">Select a channel</h2>
        <p id="channelDetails">Choose a channel from the list to start watching.</p>
        <p class="hint">Use ← → or [ ] to switch channels</p>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/video.js@8.21.0/dist/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.1/dist/js/tom-select.complete.min.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/parser.js"></script>
  <script src="./js/favourites.js"></script>
  <script src="./js/player.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
